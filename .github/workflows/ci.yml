name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .[dev]
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
      - name: CLI smoke test
        run: |
          python -m json.tool schemas/report.schema.json >/dev/null
          python -m json.tool schemas/baseline.schema.json >/dev/null
          l10n-sentinel --version
          l10n-sentinel validate --input samples/tercume-akis-sample.json --fail-on never
          l10n-sentinel check-locales \
            --source samples/locales/en.json \
            --target samples/locales/tr.json
      - name: Build validation
        run: python -m build

  action-smoke:
    name: Composite action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: sentinel
        uses: ./
        with:
          source: samples/locales/en.json
          target: samples/locales/tr.json
      - name: Verify report output
        env:
          REPORT_PATH: ${{ steps.sentinel.outputs.report }}
        run: test -s "$REPORT_PATH"
