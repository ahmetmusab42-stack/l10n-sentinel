name: Release artifacts

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build and create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tools
        run: python -m pip install .[dev]
      - name: Verify
        run: |
          ruff check src tests
          coverage run -m unittest discover -s tests -v
          coverage report
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python -c 'import tercume_akis; print(tercume_akis.__version__)')"
          test "$TAG" = "v$VERSION"
      - name: Store distributions for trusted publishing
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  publish-pypi:
    name: Publish to PyPI
    needs: build-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
